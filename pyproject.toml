[project]
name = "macagentic"
version = "0.1.0"
description = "A native macOS Cocoa UI for mini-swe-agent, written in 100% python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.75.5,<1.92",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "mini-swe-agent",
    "pyobjc>=12.2.1; sys_platform == 'darwin'",
    "quickmachotkey>=2025.7.28; sys_platform == 'darwin'",
    "ziamath>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.package-data]
"macagentic.ui" = ["assets/*.png"]
"macagentic.agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-m 'not uitest'"
markers = [
    "uitest: opens the native Cocoa UI",
]
